name: Yatate
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin -t v2.70.0
      - name: Install tomei
        run: |
          curl -fsSL https://raw.githubusercontent.com/terassyi/tomei/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Validate chezmoi templates
        run: |
          chezmoi init --source=. --no-tty
          chezmoi execute-template --source=. --no-tty < /dev/null > /dev/null
          chezmoi diff --source=. --no-tty --exclude=encrypted || true
      - name: Validate tomei manifests
        run: tomei validate dot_config/tomei/
      - name: Check fish syntax
        run: |
          chezmoi init --source=. --no-tty
          find . -name "*.fish" -print0 | xargs -0 -I{} fish -n "{}"

  test:
    needs: validate
    strategy:
      # Native Linux legs run on ubuntu-26.04 / ubuntu-26.04-arm to match the
      # deploy target (Ubuntu 26.04). This matters because some packages differ
      # by release — e.g. bpftool is a real package on 26.04 but a virtual one
      # on 24.04, so the bpf-dev SystemPackageSet only resolves on 26.04. These
      # 26.04 runner labels are currently Preview (no SLA); revisit if they prove
      # flaky. The container legs stay on GA ubuntu-24.04 runners but exercise
      # the 26.04 image (Dockerfile FROM ubuntu:26.04), so the Docker host OS is
      # irrelevant. macOS has no container option, so it keeps a native leg.
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            mode: container
          - runner: ubuntu-24.04-arm
            arch: arm64
            mode: container
          - runner: ubuntu-26.04
            arch: amd64
            mode: native
          - runner: ubuntu-26.04-arm
            arch: arm64
            mode: native
          - runner: macos-latest
            arch: arm64
            mode: native
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # --- container mode ---
      - name: Build test image
        if: matrix.mode == 'container'
        run: docker build -t yatate .
      - name: Run test in container (with encryption)
        if: matrix.mode == 'container'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/testuser/yatate \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e AQUA_GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e AGE_TEST_SECRET_KEY="${AGE_TEST_SECRET_KEY}" \
            yatate bash -c "\
              /home/testuser/yatate/scripts/setup-test-key.sh && \
              /home/testuser/yatate/scripts/test.sh && \
              /home/testuser/yatate/scripts/test-tools.sh"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGE_TEST_SECRET_KEY: ${{ secrets.AGE_TEST_SECRET_KEY }}

      # --- native mode ---
      - name: Install chezmoi (native)
        if: matrix.mode == 'native'
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin -t v2.70.0
      - name: Setup test age key (native)
        if: matrix.mode == 'native'
        run: bash scripts/setup-test-key.sh
        env:
          AGE_TEST_SECRET_KEY: ${{ secrets.AGE_TEST_SECRET_KEY }}
      - name: Run test (native)
        if: matrix.mode == 'native'
        run: bash scripts/test.sh "${{ github.workspace }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tool checks (native)
        if: matrix.mode == 'native'
        run: bash scripts/test-tools.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
