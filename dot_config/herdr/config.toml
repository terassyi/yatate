# herdr — agent-aware terminal multiplexer.
# Managed by chezmoi. herdr reads ~/.config/herdr/config.toml on both Linux and
# macOS (XDG-style path, identical on both), so this single file is applied
# transparently to every host. Platform differences are handled by herdr's own
# platform-aware options (shell_mode = "auto", terminal-native notifications)
# rather than by chezmoi templating, keeping the config declarative.
#
# Regenerate the annotated default with `herdr --default-config` and reload a
# running server with `herdr server reload-config`.

# Skip the interactive onboarding — configuration is managed declaratively here.
onboarding = false

[update]
# The binary is pinned and installed via tomei (dot_config/tomei/common-tools.cue),
# so herdr should not nag about updates or drift-check its own manifest.
channel        = "stable"
version_check  = false
manifest_check = false

[terminal]
# fish is the login shell on every host (see tomei linux-tools.cue / darwin-brew.cue).
default_shell = "fish"
# "auto" = login shell on macOS only, so Homebrew's PATH/`brew shellenv` is
# initialised there; non-login on Linux, matching each platform's convention.
shell_mode = "auto"
# New panes/tabs open in the focused pane's current directory.
new_cwd = "follow"

[keys]
# tmux-style prefix (press prefix, then the action key).
prefix          = "ctrl+b"
goto            = "prefix+g"
new_tab         = "prefix+t"
# Tab navigation on y/u (left/right), keeping hjkl free for pane focus.
previous_tab    = "prefix+y"
next_tab        = "prefix+u"
copy_mode       = "prefix+["
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical   = "prefix+v"
split_horizontal = "prefix+minus"
close_pane       = "prefix+x"
toggle_sidebar   = "prefix+b"

# Quick launchers.
[[keys.command]]
key         = "prefix+alt+g"
type        = "pane"
command     = "lazygit"
description = "run lazygit"

[theme]
# Match the tokyonight scheme used by nvim (dot_config/nvim/init.lua).
name        = "tokyo-night"
auto_switch = false
light_name  = "tokyo-night-day"
dark_name   = "tokyo-night"

[ui]
sidebar_width = 16
mouse_capture = true
pane_borders  = true
pane_gaps     = false

[ui.toast]
# "herdr" shows the toast inside the herdr UI itself, so it never leaks to the
# host terminal (e.g. Windows Terminal under WSL) nor depends on an OS notifier
# daemon. Identical, predictable behaviour on Linux, macOS and WSL.
delivery      = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
# No sound asset is shipped with the dotfiles, so keep audible toasts off to
# avoid missing-file warnings across platforms.
enabled = false

[advanced]
scrollback_limit_bytes = 10485760

[remote]
# Behaviour of the `herdr --remote <ssh-target>` bridge. Setting this explicitly
# (rather than relying on the default) keeps the intent declarative.
# When true, herdr runs the bridge ssh through a generated config that includes
# ~/.ssh/config first and appends ServerAliveInterval/ServerAliveCountMax as a
# fallback, so idle connections survive NAT/network timeouts while any keepalive
# you set yourself still wins. Set false to run plain ssh against your ssh config
# unchanged (this only stops herdr adding its own keepalive, it does not force it off).
manage_ssh_config = true
